# Render Blueprint fuer die Burak Rental Suite
# Doku: https://render.com/docs/blueprint-spec
#
# Deployt direkt aus diesem GitHub-Repo mit PERSISTENTER Datenbank:
# Die SQLite-Datei liegt auf einer dauerhaften Disk (/var/data/crm.db) und
# ueberlebt Neustarts und Deploys. Echte Kundendaten bleiben also erhalten.
#
# Hinweis: Eine persistente Disk erfordert den Plan "starter" (kostenpflichtig).
# Zum reinen Testen ohne Kosten: plan auf "free" setzen, den disk-Block sowie
# die DB_PATH-Variable wieder auskommentieren (siehe DEPLOY.md).

services:
  - type: web
    name: burak-rental-suite
    runtime: python
    plan: starter
    region: frankfurt
    branch: claude/friendly-babbage-6ddxks
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # 0 = ohne Demodaten starten (leere Produktiv-DB fuer echte Daten).
      # Auf "1" setzen, um die DB einmalig mit Demodaten zu befuellen.
      - key: SEED
        value: "0"
      # Persistenter Speicherort der DB auf der gemounteten Disk:
      - key: DB_PATH
        value: /var/data/crm.db

    # ---- Persistente Datenbank ----
    # Die Disk wird unter /var/data gemountet; DB_PATH zeigt dorthin.
    disk:
      name: crm-data
      mountPath: /var/data
      sizeGB: 1
