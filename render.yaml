# Render Blueprint fuer die Burak Rental Suite
# Doku: https://render.com/docs/blueprint-spec
#
# Deployt direkt aus diesem GitHub-Repo auf dem KOSTENLOSEN Plan.
# Keine Kreditkarte noetig. Hinweise zum Free-Plan:
#  - Cold Start: Nach Inaktivitaet schlaeft der Dienst; erster Aufruf danach ~30 s.
#  - Daten nicht dauerhaft: Das Dateisystem ist fluechtig. Bei jedem Neustart/
#    Deploy wird die SQLite-DB neu angelegt und (SEED=1) mit Demodaten befuellt.
#
# Fuer DAUERHAFTE Daten spaeter: Plan auf "starter" anheben, einen disk-Block
# (mountPath /var/data) ergaenzen und DB_PATH=/var/data/crm.db setzen
# (siehe DEPLOY.md, Abschnitt "Schritt fuer Schritt online").

services:
  - type: web
    name: burak-rental-suite
    runtime: python
    plan: free
    region: frankfurt
    branch: claude/friendly-babbage-6ddxks
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Demodaten beim Start anlegen ("0" = leere DB).
      - key: SEED
        value: "1"
