{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:760px">
    <h2>Firmendaten (für Angebote & Mietverträge)</h2>
    <form method="post" action="/einstellungen/speichern">
        <div class="field"><label>Firmenname</label><input name="company_name" value="{{ s.company_name or '' }}"></div>
        <div class="field"><label>Adresse</label><input name="address" value="{{ s.address or '' }}"></div>
        <div class="row">
            <div class="field"><label>Telefon</label><input name="phone" value="{{ s.phone or '' }}"></div>
            <div class="field"><label>E-Mail</label><input name="email" value="{{ s.email or '' }}"></div>
        </div>
        <div class="row cols-3">
            <div class="field"><label>MwSt.-Satz (%)</label><input name="vat_rate" value="{{ s.vat_rate }}"></div>
            <div class="field"><label>USt-IdNr.</label><input name="tax_id" value="{{ s.tax_id or '' }}"></div>
            <div class="field"><label>Bank</label><input name="bank" value="{{ s.bank or '' }}"></div>
        </div>
        <div class="field"><label>IBAN</label><input name="iban" value="{{ s.iban or '' }}"></div>
        <div class="field"><label>Fußzeile / AGB-Hinweis</label><textarea name="footer">{{ s.footer or '' }}</textarea></div>
        <div class="form-actions"><button class="btn primary" type="submit">Speichern</button></div>
    </form>
</div>
{% endblock %}
