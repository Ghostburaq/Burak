<!-- Engineering.Kabuu Signet (Vektor-Version).
     Motiv nach den 3D-Renderings: ein durchgehender Signalzug durch drei Zonen,
     rot (transient) -> magenta (einschwingend) -> blau/violett (stabil),
     dahinter ein vertikaler Stahl-Balken als Messpunkt-Referenz. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 200" role="img" aria-label="Engineering.Kabuu">
  <title>Engineering.Kabuu</title>

  <!-- Stahl-Balken (Messreferenz), leicht abgerundet -->
  <rect x="238" y="20" width="22" height="160" rx="4" fill="#959AAF"/>

  <!-- signalrot: transient (Einbruch, grosse Auslenkungen) -->
  <path d="M 10 100
           L 60 100
           C 78 30, 100 30, 118 70
           C 140 160, 165 175, 190 105
           C 205 65, 225 75, 240 118"
        fill="none" stroke="#E2081B" stroke-width="14"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- signal-magenta: einschwingend (abnehmende Amplitude) -->
  <path d="M 240 118
           C 258 88, 278 148, 298 108
           C 316 74, 334 138, 352 112
           C 366 92, 380 128, 394 116"
        fill="none" stroke="#900B6F" stroke-width="14"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- signal-violett: stabil (feine Restwelle, dann glatt) -->
  <path d="M 394 116
           C 410 108, 424 122, 440 114
           C 456 108, 472 116, 502 114"
        fill="none" stroke="#3317E9" stroke-width="14"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
